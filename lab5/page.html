<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Task 4 — POST: створення поста</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 2rem auto; padding: 1rem; line-height: 1.5; }
    h1 { color: #2050a0; }
    #post-form { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; padding: 1rem; background: #f6f8fa; border-radius: 6px; }
    #post-form input, #post-form textarea { padding: 8px; border: 1px solid #ccd; border-radius: 4px; font-family: inherit; font-size: 1rem; }
    #post-form button { padding: 10px; background: #2050a0; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    #post-form button:disabled { opacity: 0.6; cursor: wait; }
    #error { color: #c33; font-size: 0.9em; min-height: 1.2em; }
    #posts li { padding: 0.8rem 0; border-bottom: 1px solid #eee; }
    #posts li.new { background: #fffde6; padding: 0.8rem; border-radius: 4px; }
    #posts h3 { margin: 0 0 0.3rem; font-size: 1.05rem; }
    #posts p { margin: 0; color: #555; font-size: 0.95em; }
  </style>
</head>
<body>

  <h1>Створити пост</h1>

  <form id="post-form">
    <input name="title" placeholder="Заголовок" required>
    <textarea name="body" placeholder="Текст (мін. 10 символів)" rows="4" required></textarea>
    <input name="userId" type="number" value="1" min="1" max="10">
    <button type="submit">Опублікувати</button>
    <span id="error"></span>
  </form>

  <h2>Останні пости</h2>
  <ul id="posts"></ul>

  <script src="create.js"></script>
</body>
</html>
